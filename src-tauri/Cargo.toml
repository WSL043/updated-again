[package]
name = "updated-again"
version = "0.1.2"
description = "A living software toy that updates because updating is the point."
authors = ["WSL043 and Updated Again contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/WSL043/updated-again"

[lib]
name = "updated_again_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
