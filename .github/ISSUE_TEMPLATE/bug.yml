name: Bug report
description: Report a reproducible problem without including secrets
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Core and capsule version
      placeholder: Core v0.1.0-beta.1 / D-20260814-0001
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Web/PWA, Windows, Linux, macOS Apple Silicon, macOS Intel]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: markdown
    attributes:
      value: Do not paste credentials, signing keys, or private update URLs.
