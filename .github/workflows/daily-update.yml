name: Keep the project alive

on:
  schedule:
    - cron: "17 0 * * *"
    - cron: "23 4 * * *"
    - cron: "37 8 * * *"
    - cron: "43 12 * * *"
    - cron: "47 15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Optional Asia/Shanghai date (YYYY-MM-DD)
        required: false
        type: string
      force:
        description: Publish one update regardless of today's random plan
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: living-release-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.17.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Map schedule to a release slot
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "17 0 * * *") SLOT=0 ;;
            "23 4 * * *") SLOT=1 ;;
            "37 8 * * *") SLOT=2 ;;
            "43 12 * * *") SLOT=3 ;;
            *) SLOT=4 ;;
          esac
          echo "UPDATE_SLOT=$SLOT" >> "$GITHUB_ENV"
      - name: Generate the constrained-random update
        env:
          CAPSULE_SIGNING_PRIVATE_KEY: ${{ secrets.CAPSULE_SIGNING_PRIVATE_KEY }}
          CHAOS_SEED: ${{ secrets.CHAOS_SEED }}
          UPDATE_DATE: ${{ inputs.date }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$FORCE" == "true" ]]; then args+=(--force); fi
          node scripts/run-daily-update.mjs "${args[@]}"
      - run: pnpm update:validate
      - name: Commit only living-update artifacts
        shell: bash
        run: |
          if git diff --quiet -- public/feed/index.json public/updates; then
            echo "The current slot intentionally produced no release."
            exit 0
          fi
          git config user.name "updated-again-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/feed/index.json public/updates
          day="${UPDATE_DATE:-$(TZ=Asia/Shanghai date +%F)}"
          git commit -m "chore(update): keep ${day} alive"
          git push origin HEAD:main
