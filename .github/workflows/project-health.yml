name: Audit living project health

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: living-release-writer
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate local ledger and public deployment
        id: health
        continue-on-error: true
        run: |
          pnpm update:validate
          node scripts/audit-deployment.mjs
      - name: Refresh the verified README record
        if: steps.health.outcome == 'success'
        run: |
          node scripts/update-readme-status.mjs
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name "updated-again-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(status): refresh the daily README record"
          git push origin HEAD:main
      - name: Open one actionable incident
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create automated-health --color d73a4a --description "Living-project health automation" --force
          if [[ "$(gh issue list --state open --label automated-health --json number --jq length)" == "0" ]]; then
            gh issue create --title "[health] 日更账本或公开站点需要修复" --body "自动体检发现本地签名账本、今日覆盖或 Pages 同步不一致：${RUN_URL}" --label automated-health
          fi
      - name: Close recovered incidents
        if: steps.health.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for number in $(gh issue list --state open --label automated-health --json number --jq '.[].number'); do
            gh issue close "$number" --comment "自动体检已恢复正常，本次事件关闭。"
          done
      - name: Fail the audit when health checks fail
        if: always() && steps.health.outcome == 'failure'
        run: exit 1
